<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 柏星龙业务数字化中台</title>
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
  <div class="login-page">
    <!-- 左侧品牌区 -->
    <div class="login-brand">
      <div class="login-brand-content">
        <div class="login-brand-logo">
          <div class="login-brand-logo-icon">柏</div>
          <div>
            <div class="login-brand-name">柏星龙</div>
            <div class="login-brand-name-en">BAIXINGLONG</div>
          </div>
        </div>
        <h1 class="login-brand-title">业务数字化中台</h1>
        <p class="login-brand-subtitle">构建企业数字化统一门户，赋能业务高效协同</p>
        <div class="login-features">
          <div class="login-feature">
            <div class="login-feature-icon">🔒</div>
            <div class="login-feature-text">安全加密</div>
          </div>
          <div class="login-feature">
            <div class="login-feature-icon">🔑</div>
            <div class="login-feature-text">统一认证</div>
          </div>
          <div class="login-feature">
            <div class="login-feature-icon">⚡</div>
            <div class="login-feature-text">快速接入</div>
          </div>
        </div>
      </div>
      <div class="login-brand-footer">
        Copyright © 2025 柏星龙集团
      </div>
    </div>

    <!-- 右侧登录表单区 -->
    <div class="login-form-wrapper">
      <div class="login-form-container">
        <div class="login-welcome">
          <h2 class="login-welcome-title">欢迎登录</h2>
          <p class="login-welcome-subtitle">请输入您的账号信息以继续</p>
        </div>

        <div class="login-tabs">
          <div class="login-tab active">账号登录</div>
        </div>

        <form class="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <div class="form-input-icon">
              <span class="icon">👤</span>
              <input type="text" class="form-input" placeholder="请输入工号" id="username">
            </div>
          </div>

          <div class="form-group">
            <div class="form-input-icon">
              <span class="icon">🔒</span>
              <input type="password" class="form-input" placeholder="请输入密码" id="password">
              <span class="icon-right" onclick="togglePassword()">👁️</span>
            </div>
          </div>

          <div class="form-group">
            <div class="form-input-icon">
              <span class="icon">🔤</span>
              <input type="text" class="form-input" placeholder="请输入验证码" id="captcha" maxlength="4">
              <div class="captcha-img" onclick="refreshCaptcha()" title="点击刷新">A7Kp</div>
            </div>
          </div>

          <div class="login-form-options">
            <label class="login-remember">
              <input type="checkbox" id="remember">
              <span>记住密码</span>
            </label>
            <a href="javascript:;" class="login-forgot">忘记密码？</a>
          </div>

          <button type="submit" class="login-btn">登 录</button>

          <div class="login-bottom-text">
            还没有账号？<a href="javascript:;">联系管理员开通</a>
          </div>
        </form>
      </div>
      <div class="login-tech-support">技术支持：信息中心</div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwdInput = document.getElementById('password');
      const icon = pwdInput.parentElement.querySelector('.icon-right');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.textContent = '🙈';
      } else {
        pwdInput.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function refreshCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.querySelector('.captcha-img').textContent = code;
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const captcha = document.getElementById('captcha').value;

      if (!username) {
        alert('请输入工号');
        return;
      }
      if (!password) {
        alert('请输入密码');
        return;
      }
      if (!captcha) {
        alert('请输入验证码');
        return;
      }

      // 模拟登录成功，跳转到首页
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
