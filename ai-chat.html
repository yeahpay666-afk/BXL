<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI对话 - 柏星龙业务数字化中台</title>
<style>
:root {
  --header-bg: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --bg: #f0f2f5;
  --sidebar-bg: #fafbfc;
  --border: #e5e7eb;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --text-tertiary: #9ca3af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }

/* ===== 顶部导航栏 ===== */
.header {
  height: 56px; background: var(--header-bg); display: flex; align-items: center;
  padding: 0 24px; color: #fff; flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 10px; margin-right: 32px; cursor: pointer; }
.header-logo-icon {
  width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 16px;
}
.header-logo-text { font-size: 16px; font-weight: 600; white-space: nowrap; }
.header-nav { display: flex; align-items: center; gap: 4px; flex: 1; }
.header-nav-item {
  padding: 0 16px; height: 56px; display: flex; align-items: center;
  color: rgba(255,255,255,0.8); cursor: pointer; transition: all 0.2s;
  font-size: 14px; position: relative;
}
.header-nav-item:hover { color: #fff; background: rgba(255,255,255,0.1); }
.header-nav-item.active { color: #fff; background: rgba(255,255,255,0.1); }
.header-nav-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #3b82f6; }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-weather { display: flex; align-items: center; gap: 4px; font-size: 13px; }
.header-bell { position: relative; font-size: 18px; cursor: pointer; }
.header-bell .badge { position: absolute; top: -4px; right: -6px; background: #ef4444; color: #fff; font-size: 10px; border-radius: 8px; padding: 0 4px; min-width: 14px; text-align: center; line-height: 14px; }
.header-user { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.header-avatar { width: 30px; height: 30px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }

/* ===== 主体布局 ===== */
.chat-layout { flex: 1; display: flex; overflow: hidden; }

/* 左侧会话栏 */
.chat-sidebar {
  width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.new-chat-btn {
  width: 100%; padding: 10px; background: var(--primary); color: #fff;
  border-radius: 8px; font-size: 14px; font-weight: 500; display: flex;
  align-items: center; justify-content: center; gap: 6px; transition: background 0.2s;
}
.new-chat-btn:hover { background: var(--primary-hover); }
.sidebar-search { padding: 12px 16px; }
.sidebar-search input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; outline: none; background: #fff;
}
.sidebar-search input:focus { border-color: var(--primary); }
.conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.conv-item {
  padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
  font-size: 13px; color: var(--text-secondary); transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.conv-item:hover { background: #eef2ff; color: var(--text); }
.conv-item.active { background: #e0e7ff; color: var(--primary); font-weight: 500; }
.conv-item .conv-icon { font-size: 14px; flex-shrink: 0; }
.conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); text-align: center; }

/* 主对话区 */
.chat-main { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
.chat-header {
  padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between; flex-shrink: 0;
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.chat-avatar {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.chat-title { font-size: 16px; font-weight: 600; }
.chat-subtitle { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.chat-header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; font-size: 16px;
  color: var(--text-secondary); transition: all 0.15s;
}
.icon-btn:hover { background: #f3f4f6; color: var(--text); }

/* 消息区 */
.chat-messages { flex: 1; overflow-y: auto; padding: 24px; }
.msg-row { display: flex; gap: 12px; margin-bottom: 24px; }
.msg-row.ai { justify-content: flex-start; }
.msg-row.user { justify-content: flex-end; }
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.msg-row.ai .msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.msg-row.user .msg-avatar { background: #3b82f6; color: #fff; }
.msg-bubble {
  max-width: 70%; padding: 12px 16px; border-radius: 12px;
  font-size: 14px; line-height: 1.7; word-break: break-word;
}
.msg-row.ai .msg-bubble { background: #f3f4f6; color: var(--text); border-top-left-radius: 4px; }
.msg-row.user .msg-bubble { background: var(--primary); color: #fff; border-top-right-radius: 4px; }
.msg-time { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
.msg-row.user .msg-time { text-align: right; }

/* 打字动画 */
.typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing-dots span {
  width: 7px; height: 7px; background: #9ca3af; border-radius: 50%;
  animation: typing 1.4s infinite ease-in-out both;
}
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

/* 快捷建议 */
.suggestions {
  padding: 12px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
}
.suggestion-chip {
  padding: 7px 14px; background: #f3f4f6; border: 1px solid var(--border);
  border-radius: 16px; font-size: 13px; color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s;
}
.suggestion-chip:hover { background: #eef2ff; border-color: var(--primary); color: var(--primary); }

/* 输入区 */
.chat-input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); flex-shrink: 0; background: #fafbfc; }
.input-wrapper {
  display: flex; align-items: flex-end; gap: 10px; background: #fff;
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  transition: border-color 0.2s;
}
.input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.input-wrapper textarea {
  flex: 1; border: none; outline: none; resize: none; font-size: 14px;
  font-family: inherit; max-height: 120px; min-height: 24px; line-height: 1.5;
}
.input-tools { display: flex; gap: 4px; }
.tool-btn {
  width: 32px; height: 32px; border-radius: 6px; display: flex;
  align-items: center; justify-content: center; font-size: 16px;
  color: var(--text-tertiary); transition: all 0.15s;
}
.tool-btn:hover { background: #f3f4f6; color: var(--text); }
.send-btn {
  width: 40px; height: 40px; background: var(--primary); color: #fff;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background 0.2s;
}
.send-btn:hover { background: var(--primary-hover); }
.send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
.input-tip { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; text-align: center; }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

/* 消息通知下拉面板 */
.notify-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 380px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  z-index: 2000;
  display: none;
  overflow: hidden;
}
.notify-panel.show { display: block; }
.notify-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.notify-panel-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.notify-panel-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
.notify-mark-all { font-size: 12px; color: #3b82f6; cursor: pointer; }
.notify-mark-all:hover { text-decoration: underline; }
.notify-tabs { display: flex; padding: 0 16px; border-bottom: 1px solid #f1f5f9; }
.notify-tab {
  padding: 10px 0; margin-right: 20px; font-size: 13px; color: #64748b;
  cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s;
}
.notify-tab.active { color: #1e293b; border-bottom-color: #3b82f6; font-weight: 500; }
.notify-tab .tab-count { background: #ef4444; color: #fff; font-size: 10px; padding: 0 5px; border-radius: 8px; margin-left: 4px; }
.notify-list { max-height: 360px; overflow-y: auto; }
.notify-item {
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid #f8fafc;
}
.notify-item:hover { background: #f8fafc; }
.notify-item.unread { background: #eff6ff; }
.notify-item-icon {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.notify-item-icon.meeting { background: #dbeafe; }
.notify-item-icon.system { background: #fef3c7; }
.notify-item-icon.approval { background: #dcfce7; }
.notify-item-content { flex: 1; min-width: 0; }
.notify-item-title { font-size: 13px; font-weight: 500; color: #1e293b; display: flex; align-items: center; gap: 6px; }
.notify-item-title .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; flex-shrink: 0; }
.notify-item-desc { font-size: 12px; color: #64748b; margin-top: 3px; line-height: 1.5; }
.notify-item-time { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.notify-empty { padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 13px; }
.notify-panel-footer {
  padding: 12px 16px;
  border-top: 1px solid #f1f5f9;
  text-align: center;
  font-size: 13px;
  color: #3b82f6;
  cursor: pointer;
}
.notify-panel-footer:hover { background: #f8fafc; }

      </div>

      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg-row ai">
        <div class="msg-avatar">🤖</div>
        <div>
          <div class="msg-bubble">您好，张建国！我是柏星龙AI助手，可以帮您：<br>📋 解答业务系统操作问题<br>📊 查询数据报表<br>📝 生成会议纪要、文档<br>🔔 提醒待办事项<br><br>请问有什么可以帮您的？</div>
          <div class="msg-time">09:00</div>
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <span class="suggestion-chip" onclick="sendSuggestion('如何预定会议室？')">如何预定会议室？</span>
      <span class="suggestion-chip" onclick="sendSuggestion('帮我生成Q3季度总结')">帮我生成Q3季度总结</span>
      <span class="suggestion-chip" onclick="sendSuggestion('查询本月报销进度')">查询本月报销进度</span>
      <span class="suggestion-chip" onclick="sendSuggestion('T100系统如何做采购入库？')">T100采购入库流程</span>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="msgInput" placeholder="输入您的问题，Enter发送，Shift+Enter换行" rows="1" onkeydown="handleKey(event)"></textarea>
        <div class="input-tools">
          <button class="tool-btn" title="上传附件">📎</button>
          <button class="tool-btn" title="语音输入">🎤</button>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">➤</button>
      </div>
      <div class="input-tip">AI生成内容仅供参考，请核实重要信息</div>
    </div>
  </main>
</div>

<script>
var conversations = [
  { id: 1, title: '如何预定会议室？', time: '今天 09:00' },
  { id: 2, title: 'Q3季度总结大纲', time: '昨天 16:30' },
  { id: 3, title: '报销流程咨询', time: '昨天 10:15' },
  { id: 4, title: 'T100采购入库操作', time: '09-15 14:20' },
  { id: 5, title: 'HR系统考勤查询', time: '09-14 09:00' }
];
var currentConvId = 1;

function renderConvList(filter) {
  filter = filter || '';
  var list = conversations.filter(function(c){ return c.title.indexOf(filter) >= 0; });
  document.getElementById('convList').innerHTML = list.map(function(c){
    return '<div class="conv-item' + (c.id === currentConvId ? ' active' : '') + '" onclick="selectConv(' + c.id + ')">' +
      '<span class="conv-icon">💬</span><span class="conv-title">' + c.title + '</span>' +
    '</div>';
  }).join('');
}

function filterConv(val) { renderConvList(val); }

function selectConv(id) {
  currentConvId = id;
  renderConvList();
  showToast('已切换到：' + conversations.find(function(c){return c.id===id;}).title);
}

function newChat() {
  currentConvId = null;
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('suggestions').style.display = 'flex';
  renderConvList();
  addAIMsg('您好！我是柏星龙AI助手，请问有什么可以帮您的？');
}

function clearChat() {
  if (!confirm('确定要清空当前对话吗？')) return;
  document.getElementById('chatMessages').innerHTML = '';
  addAIMsg('对话已清空，请问有什么可以帮您的？');
}

function addUserMsg(text) {
  var now = new Date();
  var time = (now.getHours()<10?'0':'') + now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
  var html = '<div class="msg-row user"><div>' +
    '<div class="msg-bubble">' + escapeHtml(text) + '</div>' +
    '<div class="msg-time">' + time + '</div></div>' +
    '<div class="msg-avatar">张</div></div>';
  document.getElementById('chatMessages').insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function addAIMsg(text) {
  var now = new Date();
  var time = (now.getHours()<10?'0':'') + now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
  var html = '<div class="msg-row ai"><div class="msg-avatar">🤖</div><div>' +
    '<div class="msg-bubble">' + text + '</div>' +
    '<div class="msg-time">' + time + '</div></div></div>';
  document.getElementById('chatMessages').insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function showTyping() {
  var html = '<div class="msg-row ai" id="typingRow"><div class="msg-avatar">🤖</div><div>' +
    '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div></div>';
  document.getElementById('chatMessages').insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function removeTyping() {
  var t = document.getElementById('typingRow');
  if (t) t.remove();
}

var aiReplies = {
  '会议室': '预定会议室步骤：<br>1. 进入「首页」→「我的日程」<br>2. 点击「+ 预定会议室」<br>3. 填写会议主题、时间、参会人<br>4. 选择会议室（可查看照片和容纳人数）<br>5. 设置提醒后保存即可<br><br>需要我帮您查看当前可用会议室吗？',
  '报销': '报销流程如下：<br>1. 进入「报销」应用<br>2. 点击「新建报销单」<br>3. 选择费用类型（差旅/招待/办公等）<br>4. 上传发票附件，填写金额<br>5. 提交审批，流程会自动流转到直属主管<br><br>您可以在「我的报销」中查看审批进度。',
  'T100': 'T100采购入库操作步骤：<br>1. 登录T100系统<br>2. 进入「采购管理」→「采购入库」<br>3. 选择对应的采购订单<br>4. 核对入库数量和批次<br>5. 确认入库后系统自动生成库存记录<br><br>如遇库存差异，需在「差异处理」中报备。',
  '总结': '我可以帮您生成季度总结，建议包含以下结构：<br>📌 核心指标完成情况<br>📌 重点工作回顾<br>📌 问题与改进措施<br>📌 下季度计划<br><br>请告诉我您负责的业务板块和主要数据，我来帮您整理。',
  'default': '好的，我已收到您的问题。我正在为您查询相关信息，请稍候...<br><br>如果您有紧急事务，建议直接联系对应业务系统的负责人。'
};

function getAIReply(text) {
  for (var key in aiReplies) {
    if (key !== 'default' && text.indexOf(key) >= 0) return aiReplies[key];
  }
  return aiReplies['default'];
}

function sendMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = '';
  autoResize();
  document.getElementById('suggestions').style.display = 'none';
  showTyping();
  setTimeout(function() {
    removeTyping();
    addAIMsg(getAIReply(text));
  }, 1200);
}

function sendSuggestion(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize() {
  var input = document.getElementById('msgInput');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}
document.getElementById('msgInput').addEventListener('input', autoResize);

function scrollToBottom() {
  var el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; });
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 2000);
}

renderConvList();
</script>

<script>
/* ===== 消息通知系统 ===== */
    var notifications = [
      { id: 101, type: 'meeting', icon: '📅', title: '会议邀请：产品需求评审会', desc: '李明轩 邀请您参加 09-11 10:30-12:00 研发会议室的产品需求评审会', time: '10分钟前', read: false },
      { id: 102, type: 'meeting', icon: '📅', title: '会议提醒：客户项目沟通会', desc: '您有一场会议将在30分钟后开始 · 二号会议室', time: '30分钟前', read: false },
      { id: 103, type: 'meeting', icon: '📅', title: '会议取消：团队建设讨论', desc: '刘雅婷 取消了原定于 09-07 的团队建设讨论会', time: '1小时前', read: false },
      { id: 104, type: 'approval', icon: '✅', title: '审批通过：差旅费报销', desc: '您提交的差旅费报销单已审批通过', time: '2小时前', read: false },
      { id: 105, type: 'system', icon: '🔔', title: '系统通知：OA系统升级', desc: 'OA系统将于今晚22:00进行升级维护，预计1小时', time: '3小时前', read: true }
    ];
    var currentNotifyTab = 'all';

    function toggleNotifyPanel(e) {
      e.stopPropagation();
      var panel = document.getElementById('notifyPanel');
      panel.classList.toggle('show');
      if (panel.classList.contains('show')) renderNotifyList();
    }
    document.addEventListener('click', function() {
      document.getElementById('notifyPanel').classList.remove('show');
    });

    function switchNotifyTab(el, type) {
      document.querySelectorAll('.notify-tab').forEach(function(t){ t.classList.remove('active'); });
      el.classList.add('active');
      currentNotifyTab = type;
      renderNotifyList();
    }

    function renderNotifyList() {
      var list = currentNotifyTab === 'all' ? notifications : notifications.filter(function(n){ return n.type === currentNotifyTab; });
      var html = list.map(function(n){
        return '<div class="notify-item' + (n.read ? '' : ' unread') + '" onclick="readNotify(' + n.id + ')">' +
          '<div class="notify-item-icon ' + n.type + '">' + n.icon + '</div>' +
          '<div class="notify-item-content">' +
            '<div class="notify-item-title">' + (n.read ? '' : '<span class="unread-dot"></span>') + n.title + '</div>' +
            '<div class="notify-item-desc">' + n.desc + '</div>' +
            '<div class="notify-item-time">' + n.time + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('notifyList').innerHTML = html || '<div class="notify-empty">暂无消息</div>';
      updateNotifyBadge();
    }

    function readNotify(id) {
      var n = notifications.find(function(x){ return x.id === id; });
      if (n) { n.read = true; renderNotifyList(); }
    }

    function markAllNotifyRead() {
      notifications.forEach(function(n){ n.read = true; });
      renderNotifyList();
      showToast('已全部标记为已读', 'success');
    }

    function updateNotifyBadge() {
      var unread = notifications.filter(function(n){ return !n.read; }).length;
      var badge = document.getElementById('notifyBadge');
      if (unread > 0) { badge.style.display = ''; badge.textContent = unread > 99 ? '99+' : unread; }
      else { badge.style.display = 'none'; }
      document.getElementById('tabCountAll').textContent = unread;
    }
</script>
</body>
</html>
